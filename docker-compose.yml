# The one supported deploy path: `docker compose up --build` (README: "Deploy it (Deployer walkthrough)").
# Configuration comes from `.env` (copy .env.compose.example). Nothing secret is baked into the image.
#
# Migration runs as a one-shot service with APP_ENV=production and
# `--confirm-database "$POSTGRES_DB"`: the database host is the container name `db`, which is not
# local, so the confirmed production path of ADR-0002 is the only one that applies. The app starts
# only after it completes. The seed is never run and no Demo users are created.

name: workspace-ai-assistant

# Bounded container logs (json-file driver): at most 5 files of 10 MB per service, so logs cannot fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workspace_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (URL-safe characters only)}
      POSTGRES_DB: ${POSTGRES_DB:-workspace_ai}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    logging: *default-logging
    build:
      context: .
      target: migrate
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-workspace_ai}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-workspace_ai}
      POSTGRES_DB: ${POSTGRES_DB:-workspace_ai}
    # sh -c so the confirmed name is read from the container environment and can never differ from the database created above.
    command: ["sh", "-c", "npm run db:migrate -- --confirm-database \"$$POSTGRES_DB\""]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Deployer first-run command, not started by `up` (profile `tools`):
  #   docker compose run --rm bootstrap --workspace "Acme"
  # Same image and the same confirmed production path as `migrate`; extra arguments are passed to `npm run bootstrap`.
  # BETTER_AUTH_URL is what the printed Owner Invitation link is built from.
  bootstrap:
    logging: *default-logging
    profiles: ["tools"]
    build:
      context: .
      target: migrate
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-workspace_ai}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-workspace_ai}
      POSTGRES_DB: ${POSTGRES_DB:-workspace_ai}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env to the address people open, for example http://localhost:3000}
    entrypoint: ["sh", "-c", "npm run --silent bootstrap -- --confirm-database \"$$POSTGRES_DB\" \"$$@\"", "sh"]
    command: []
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    logging: *default-logging
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-workspace_ai}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-workspace_ai}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (at least 32 random characters)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env to the address people open, for example http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:?Set AI_PROVIDER in .env (openai or openai-compatible; fake is refused in production)}
      AI_MODEL: ${AI_MODEL:?Set AI_MODEL in .env}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      USAGE_LIMIT_USER_PER_MINUTE: ${USAGE_LIMIT_USER_PER_MINUTE:-10}
      USAGE_LIMIT_WORKSPACE_PER_DAY: ${USAGE_LIMIT_WORKSPACE_PER_DAY:-200}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Shallow liveness (no database ping), so a short database outage does not mark the app unhealthy.
    # Uses node because the runtime image has no curl.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
