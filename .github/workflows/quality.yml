name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workspace_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workspace_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/workspace_ai_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/workspace_ai_test
      BETTER_AUTH_SECRET: ci-only-secret-that-is-not-used-outside-this-job
      BETTER_AUTH_URL: http://localhost:3000
      DEMO_USER_A_EMAIL: user-a@example.test
      DEMO_USER_A_PASSWORD: ci-only-user-a-password
      DEMO_USER_B_EMAIL: user-b@example.test
      DEMO_USER_B_PASSWORD: ci-only-user-b-password
      AI_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply schema to isolated test database
        run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            output/playwright/
            test-results/
          if-no-files-found: ignore
      - run: npm run build

  # Compose is production-only (ADR-0002 refuses AI_PROVIDER=fake with APP_ENV=production at the first chat request,
  # not at boot), so this job boots with the fake provider, runs bootstrap, accepts the Owner Invitation and signs in.
  # It never chats: streamed fake chat is covered by the Playwright journeys in `quality`.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Write a job-local env file
        run: |
          {
            echo "POSTGRES_PASSWORD=ci$(openssl rand -hex 16)"
            echo "BETTER_AUTH_SECRET=ci$(openssl rand -hex 32)"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "AI_PROVIDER=fake"
            echo "AI_MODEL=fake"
          } > "$RUNNER_TEMP/compose.env"
      - name: Build, bootstrap, accept the Owner Invitation, sign in
        run: scripts/compose-smoke.sh "$RUNNER_TEMP/compose.env"
