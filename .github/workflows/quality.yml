name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workspace_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workspace_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/workspace_ai_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/workspace_ai_test
      BETTER_AUTH_SECRET: ci-only-secret-that-is-not-used-outside-this-job
      BETTER_AUTH_URL: http://localhost:3000
      DEMO_USER_A_EMAIL: user-a@example.test
      DEMO_USER_A_PASSWORD: ci-only-user-a-password
      DEMO_USER_B_EMAIL: user-b@example.test
      DEMO_USER_B_PASSWORD: ci-only-user-b-password
      AI_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply schema to isolated test database
        run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            output/playwright/
            test-results/
          if-no-files-found: ignore
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Write a synthetic .env
        run: |
          {
            echo "POSTGRES_PASSWORD=ci$(openssl rand -hex 12)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "BETTER_AUTH_URL=http://localhost:3000"
            echo "AI_PROVIDER=fake"
            echo "AI_MODEL=fake"
          } > .env
      - name: Build and start the stack (AI config is only read on the first chat, which this job never sends)
        run: docker compose up --build -d
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          echo "The app did not answer on /login" >&2
          exit 1
      - name: Bootstrap, accept the Invitation and sign in
        run: |
          docker compose run --rm migrate sh -c 'npm run bootstrap -- --workspace "CI Workspace" --confirm-database "$POSTGRES_DB"' | tee bootstrap.out
          link=$(grep -o 'http://localhost:3000/invite/[A-Za-z0-9_-]*' bootstrap.out | head -n 1)
          test -n "$link"
          token=${link##*/invite/}
          curl -fsS "$link" | grep -q "CI Workspace"
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d "{\"token\":\"$token\",\"name\":\"CI Owner\",\"email\":\"owner@example.test\",\"password\":\"ci-owner-$(openssl rand -hex 8)\"}" \
            http://localhost:3000/api/invitations/accept | tee accept.out
          grep -q '"signedIn":true' accept.out
          workspace=$(grep -o '"workspaceId":"[^"]*"' accept.out | cut -d'"' -f4)
          test -n "$workspace"
          curl -fsS -b cookies.txt "http://localhost:3000/w/$workspace" | grep -q "CI Workspace"
          # single-use: the same link is now invalid
          curl -fsS "$link" | grep -q "This link is not valid"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
